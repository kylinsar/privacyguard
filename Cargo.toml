[workspace]
resolver = "2"
members = [
    "crates/redact",
    "crates/providers",
    "crates/proxy-core",
    "crates/store",
    "crates/platform-macos",
    "crates/pg-cli",
    "src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.85"

[workspace.dependencies]
# async / http
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures-util = "0.3"
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1", "client-legacy"] }
http-body-util = "0.1"
http = "1"
bytes = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "stream", "http2"] }
tokio-tungstenite = { version = "0.30", default-features = false }
zstd = "0.14"
flate2 = "1"

# tls
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
rustls-pemfile = "2"
rcgen = { version = "0.14", features = ["pem", "x509-parser"] }

# data
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
rusqlite = { version = "0.40", features = ["bundled"] }
toml_edit = "0.25"
regex = "1"
aho-corasick = "1"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"

# misc
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
parking_lot = "0.12"
clap = { version = "4", features = ["derive"] }
rand = "0.9"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
