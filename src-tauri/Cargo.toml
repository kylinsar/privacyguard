[package]
name = "privacyguard"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "PrivacyGuard：本地 LLM 隐私代理"

[lib]
name = "privacyguard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
redact = { path = "../crates/redact" }
providers = { path = "../crates/providers" }
proxy-core = { path = "../crates/proxy-core" }
store = { path = "../crates/store" }
platform-macos = { path = "../crates/platform-macos" }

tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"

tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
